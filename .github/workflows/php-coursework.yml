name: PHP coursework validation
on:
  push:
    branches:
      - feature/requirement-2-php-mysql
  pull_request:
    branches:
      - feature/requirement-2-php-mysql
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php --version
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: |
          node --check assets/js/main-r2.js
          node --check assets/js/r2-contact.js
          node --check assets/js/r2-lookup.js
      - name: Validate SQL and static page routes
        run: |
          test -s database/schema.sql
          test -s database/seed.sql
          test -f index.php
          test -f san-pham.php
          test -f thanh-toan.php
          test -f actions/checkout.php
          test -f actions/lookup.php
          test -f actions/contact.php

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: localtestpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -plocaltestpass"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring
      - name: Ensure MySQL client
        run: |
          if ! command -v mysql >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y default-mysql-client; fi
      - name: Real MySQL and HTTP integration smoke
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: cas_hoa
          DB_USER: root
          DB_PASSWORD: localtestpass
        run: bash scripts/verify-r2.sh

      - name: Prepare Chrome screenshot environment
        run: |
          command -v google-chrome || command -v chromium
          sudo apt-get update -qq
          sudo apt-get install -y xvfb scrot
          python3 -m venv /tmp/cas-r2-env
          /tmp/cas-r2-env/bin/pip install --quiet selenium reportlab pillow
      - name: Capture PHP pages with real browser address bar and build PDF
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: cas_hoa
          DB_USER: root
          DB_PASSWORD: localtestpass
          DISPLAY: ':99'
        run: |
          Xvfb :99 -screen 0 1440x960x24 >/tmp/cas-xvfb.log 2>&1 &
          sleep 2
          /tmp/cas-r2-env/bin/python scripts/capture-r2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CAS_HOA_PHP_MySQL_BaoCaoYeuCau2
          path: |
            evidence/CAS_HOA_Yeu_Cau_2.pdf
            evidence/r2/*.png
            evidence/r2/manifest.json
          if-no-files-found: warn
          retention-days: 7
