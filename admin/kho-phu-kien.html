<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kho Phụ kiện | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="accessories">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Kho Phụ kiện</h1>
            <p>Quản lý giấy gói, ruy băng, thiệp, túi và các vật tư phục vụ đơn hàng.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-box-seam"></i></div>
        </section>

        <section class="admin-grid-2 admin-section">
          <article class="admin-card">
            <div class="admin-toolbar between"><h2 class="admin-card-title">Tồn kho</h2><div class="admin-toolbar"><span class="admin-badge" id="inventoryItemCount">0 mặt hàng</span><span class="admin-status danger" id="inventoryLowCount">0 sắp hết</span></div></div>
            <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Mặt hàng</th><th>Tồn</th><th>Tối thiểu</th><th>Giá nhập</th><th>Trạng thái</th></tr></thead><tbody id="inventoryRows"></tbody></table></div>
          </article>

          <article class="admin-card">
            <h2 class="admin-card-title">Điều chỉnh tồn kho</h2>
            <p class="admin-card-subtitle">Nhập số dương để nhập kho, số âm để xuất hoặc điều chỉnh giảm.</p>
            <form id="inventoryAdjustForm" class="mt-3">
              <div class="mb-3"><label class="admin-label" for="inventoryItem">Mặt hàng</label><select class="admin-select" id="inventoryItem"></select></div>
              <div class="mb-3"><label class="admin-label" for="inventoryDelta">Số lượng thay đổi</label><input class="admin-input" id="inventoryDelta" type="number" required placeholder="Ví dụ: 20 hoặc -5"></div>
              <div class="mb-3"><label class="admin-label" for="inventoryNote">Ghi chú</label><input class="admin-input" id="inventoryNote" placeholder="Nhập hàng, xuất cho đơn..."></div>
              <button class="admin-btn" type="submit">Cập nhật tồn</button>
            </form>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
