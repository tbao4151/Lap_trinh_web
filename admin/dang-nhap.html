<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản trị | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="login">
  <main class="admin-login">
    <section class="admin-login-card">
      <a class="admin-brand" href="../index.html">
        <span class="admin-brand-mark"><i class="bi bi-flower1"></i></span>
        <span><strong>CÁ'S HOA</strong><small style="color:var(--admin-muted)">flowers & feelings</small></span>
      </a>

      <h1>Trung tâm điều hành</h1>
      <p>Đăng nhập để quản lý đơn hàng, sản phẩm, kho, khách hàng và hoạt động vận hành của cửa hàng.</p>

      <form id="adminLoginForm" class="mt-4" novalidate>
        <div class="mb-3">
          <label class="admin-label" for="adminEmail">Email quản trị</label>
          <input id="adminEmail" class="admin-input" type="email" value="owner@cashoa.vn" required>
        </div>

        <div class="mb-3">
          <label class="admin-label" for="adminPassword">Mật khẩu</label>
          <input id="adminPassword" class="admin-input" type="password" value="1234" required>
        </div>

        <button class="admin-btn w-100" type="submit"><i class="bi bi-shield-lock"></i> Đăng nhập</button>
        <div id="adminLoginMessage"></div>
      </form>

      <a class="admin-btn-light w-100 mt-2" href="../index.html"><i class="bi bi-arrow-left"></i> Về cửa hàng</a>
    </section>
  </main>

  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
