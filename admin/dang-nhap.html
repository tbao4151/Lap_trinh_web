<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập quản trị | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="login">
  <main class="admin-login">
    <section class="admin-login-card">
      <a href="../index.html" class="admin-brand">
        <span class="admin-brand-mark"><i class="bi bi-flower1"></i></span>
        <span>CÁ'S HOA</span>
      </a>

      <div class="admin-kicker mt-4">Khu vực quản trị</div>
      <h1 class="fs-2 mt-2">Đăng nhập quản trị</h1>
      <p class="text-secondary small lh-lg">Quản lý sản phẩm, đơn hàng và thông tin khách hàng trong một khu vực riêng.</p>

      <form id="adminLoginForm" class="mt-4" novalidate>
        <div class="mb-3"><label class="form-label small fw-semibold" for="adminEmail">Email quản trị</label><input id="adminEmail" type="email" class="form-control admin-input" placeholder="admin@example.com" required></div>
        <div class="mb-3"><label class="form-label small fw-semibold" for="adminPassword">Mật khẩu</label><input id="adminPassword" type="password" class="form-control admin-input" placeholder="Mật khẩu" required></div>
        <button class="admin-btn w-100" type="submit"><i class="bi bi-shield-lock me-1"></i> Đăng nhập</button>
        <div id="adminLoginMessage"></div>
      </form>

      <a href="../index.html" class="d-block text-center small text-secondary mt-4">Quay lại cửa hàng</a>
    </section>
  </main>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
