<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lịch sử kho | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="stock-history">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Lịch sử kho</h1>
            <p>Lưu lại các lần nhập, xuất và điều chỉnh nguyên liệu.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-clock-history"></i></div>
        </section>

        <section class="admin-card admin-section">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>Thời gian</th><th>Mặt hàng</th><th>Loại</th><th>Số lượng</th><th>Ghi chú</th></tr></thead>
              <tbody id="stockHistoryRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
