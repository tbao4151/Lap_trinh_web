<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danh mục khám phá | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="discovery">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Danh mục khám phá</h1>
            <p>Quản lý các thẻ khám phá nhanh xuất hiện trên trang chủ.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-compass"></i></div>
        </section>

        <section class="admin-section">
          <div class="admin-grid-4" id="discoveryAdminGrid"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
