<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý nhanh | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="quick-products">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Quản lý nhanh</h1>
            <p>Điều chỉnh nhanh giá, trạng thái mẫu hôm nay và sản phẩm nổi bật.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-lightning-charge"></i></div>
        </section>

        <section class="admin-card admin-section">
          <div class="admin-note">Dùng khi cần cập nhật nhanh nhiều sản phẩm mà không mở từng trang chi tiết.</div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>Sản phẩm</th><th>Giá bán</th><th>Mẫu hôm nay</th><th>Nổi bật</th><th></th></tr></thead>
              <tbody id="quickProductRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
