<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giao hàng | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="delivery">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Giao hàng</h1>
            <p>Theo dõi lịch giao, khách tới nhận và trạng thái vận chuyển theo ngày.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-truck"></i></div>
        </section>

        <section class="admin-card admin-section">
          <div class="admin-toolbar between">
            <div class="admin-toolbar">
              <div>
                <label class="admin-label" for="deliveryDate">Ngày giao / nhận</label>
                <input class="admin-input" id="deliveryDate" type="date">
              </div>
              <div>
                <label class="admin-label" for="deliveryFilter">Trạng thái giao</label>
                <select class="admin-select" id="deliveryFilter">
                  <option value="all">Mọi trạng thái</option>
                  <option value="not_delivered">Chưa giao</option>
                  <option value="out_for_delivery">Đang giao</option>
                  <option value="delivered">Đã giao</option>
                  <option value="pickup_ready">Chờ khách lấy</option>
                </select>
              </div>
            </div>
            <span class="admin-badge" id="deliveryCount">0 lịch</span>
          </div>
        </section>

        <section class="admin-grid-2 admin-section" id="deliveryList"></section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
