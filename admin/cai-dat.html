<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cài đặt shop | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="settings">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Cài đặt shop</h1>
            <p>Quản lý thông tin công khai, liên hệ, giờ hoạt động và cấu hình giao hàng.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-gear"></i></div>
        </section>

        <section class="admin-card admin-section" style="max-width:820px">
          <form id="settingsForm" class="admin-form-grid">
            <div>
              <label class="admin-label">Tên cửa hàng</label>
              <input class="admin-input" name="shopName">
            </div>
            <div>
              <label class="admin-label">Số điện thoại</label>
              <input class="admin-input" name="phone">
            </div>
            <div>
              <label class="admin-label">Email</label>
              <input class="admin-input" name="email" type="email">
            </div>
            <div>
              <label class="admin-label">Giờ hoạt động</label>
              <input class="admin-input" name="openingHours">
            </div>
            <div>
              <label class="admin-label">Instagram</label>
              <input class="admin-input" name="instagram">
            </div>
            <div>
              <label class="admin-label">Zalo</label>
              <input class="admin-input" name="zalo">
            </div>
            <div class="full">
              <label class="admin-label">Thông báo trên đầu trang</label>
              <textarea class="admin-textarea" name="announcement" rows="3"></textarea>
            </div>
            <div class="full">
              <label class="admin-label">Địa chỉ cửa hàng</label>
              <input class="admin-input" name="address">
            </div>
            <div>
              <label class="admin-label">Phí giao mặc định</label>
              <input class="admin-input" name="defaultShipping" type="number" step="1000">
            </div>
            <div class="full"><button class="admin-btn" type="submit">Lưu cài đặt</button></div>
            <div class="full" id="settingsMessage"></div>
          </form>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
