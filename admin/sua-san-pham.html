<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sửa sản phẩm | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="product-form">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <main class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <div class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
          <div><div class="admin-kicker">Sản phẩm</div><h1 id="productFormTitle" class="admin-title">Sửa sản phẩm</h1><p class="text-secondary small mt-2 mb-0">Nhập đầy đủ thông tin để sản phẩm hiển thị rõ ràng ở cửa hàng.</p></div>
          <a class="admin-btn-light" href="san-pham.html">Quay lại danh sách</a>
        </div>

        <section class="admin-card mt-4">
          <form id="adminProductForm" class="admin-form-grid" novalidate>
            <div><label class="form-label small fw-semibold" for="productName">Tên sản phẩm</label><input id="productName" class="form-control admin-input" placeholder="Ví dụ: Mùa xanh dịu" required></div>
            <div><label class="form-label small fw-semibold" for="productSku">Mã SKU</label><input id="productSku" class="form-control admin-input" placeholder="BO-HOA-001" required></div>
            <div><label class="form-label small fw-semibold" for="productPrice">Giá bán</label><input id="productPrice" type="number" min="0" step="1000" class="form-control admin-input" placeholder="350000" required></div>
            <div><label class="form-label small fw-semibold" for="productType">Loại sản phẩm</label><select id="productType" class="form-select admin-input"><option value="bouquet">Bó hoa</option><option value="basket">Giỏ hoa</option></select></div>
            <div><label class="form-label small fw-semibold" for="productTone">Tông màu</label><select id="productTone" class="form-select admin-input"><option>Xanh</option><option>Hồng</option><option>Đỏ</option><option>Tím</option></select></div>
            <div><label class="form-label small fw-semibold" for="productOccasion">Dịp tặng</label><select id="productOccasion" class="form-select admin-input"><option>Sinh nhật</option><option>Chúc mừng</option><option>Kỷ niệm</option><option>Tặng người thương</option></select></div>
            <div><label class="form-label small fw-semibold" for="productCategory">Nhóm hoa</label><input id="productCategory" class="form-control admin-input" placeholder="Ví dụ: Hoa ly"></div>
            <div><label class="form-label small fw-semibold" for="productImage">Ảnh PNG</label><select id="productImage" class="form-select admin-input"><option value="lam-tinh.png">lam-tinh.png</option><option value="garden.png">garden.png</option><option value="hoa-ly.png">hoa-ly.png</option><option value="cam-tu-cau.png">cam-tu-cau.png</option><option value="phi-yen.png">phi-yen.png</option></select></div>
            <div class="full"><label class="form-label small fw-semibold" for="productDescription">Mô tả sản phẩm</label><textarea id="productDescription" class="form-control admin-input" rows="5" placeholder="Mô tả kiểu dáng, cảm giác và dịp tặng phù hợp..."></textarea></div>
            <div class="full form-check"><input id="productToday" class="form-check-input" type="checkbox"><label for="productToday" class="form-check-label">Hiển thị trong danh sách “Mẫu hôm nay”</label></div>
            <div class="full"><button class="admin-btn" type="submit"><span id="productSubmitText">Lưu thay đổi</span></button><div id="productFormMessage"></div></div>
          </form>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
