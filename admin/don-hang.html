<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đơn hàng | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="orders">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Đơn hàng</h1>
            <p>Theo dõi toàn bộ vòng đời đơn: xác nhận, thanh toán, chuẩn bị và hoàn tất.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-clipboard2-check"></i></div>
        </section>

        <section class="admin-card admin-section">
          <div class="admin-toolbar between">
            <div class="admin-toolbar">
              <input class="admin-input admin-search" id="orderSearch" placeholder="Tìm mã đơn, khách hàng, số điện thoại...">
              <select class="admin-select" id="orderStatusFilter" style="max-width:190px">
                <option value="all">Mọi trạng thái</option>
                <option value="pending_confirmation">Chờ xác nhận</option>
                <option value="confirmed">Đã xác nhận</option>
                <option value="preparing">Đang chuẩn bị</option>
                <option value="ready">Sẵn sàng</option>
                <option value="delivering">Đang giao</option>
                <option value="completed">Hoàn tất</option>
                <option value="cancelled">Đã huỷ</option>
              </select>
              <select class="admin-select" id="paymentStatusFilter" style="max-width:190px">
                <option value="all">Mọi thanh toán</option>
                <option value="unpaid">Chưa thanh toán</option>
                <option value="partial">Đã cọc</option>
                <option value="paid">Đã thanh toán</option>
                <option value="refunded">Đã hoàn tiền</option>
              </select>
            </div>
            <span class="admin-badge" id="adminOrderCount">0 đơn</span>
          </div>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>Mã đơn</th><th>Người đặt</th><th>Người nhận / lịch nhận</th><th>Giá trị</th><th>Thanh toán</th><th>Trạng thái</th></tr></thead>
              <tbody id="adminOrderRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
