<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quản lý sản phẩm | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="products">
  <div class="admin-layout">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <main class="admin-main">
      <header class="admin-topbar" id="adminTopbar"></header>
      <div class="admin-content">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3">
          <div><div class="admin-kicker">Sản phẩm</div><h1 class="admin-title">Quản lý sản phẩm</h1><p class="text-secondary small mt-2 mb-0">Tìm kiếm, xem giá và chỉnh sửa thông tin các mẫu hoa.</p></div>
          <a class="admin-btn" href="them-san-pham.html"><i class="bi bi-plus-lg me-1"></i> Thêm sản phẩm</a>
        </div>

        <section class="admin-card mt-4">
          <div class="d-flex flex-wrap justify-content-between gap-3 align-items-center">
            <input id="adminProductSearch" class="form-control admin-input" style="max-width: 360px" placeholder="Tìm tên, SKU, loại hoa...">
            <span id="adminProductCount" class="admin-badge">0 sản phẩm</span>
          </div>
          <div class="admin-table-wrap mt-3">
            <table class="admin-table">
              <thead><tr><th>Ảnh</th><th>Sản phẩm</th><th>Loại</th><th>Giá</th><th>Trạng thái</th><th>Thao tác</th></tr></thead>
              <tbody id="adminProductRows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
