<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phân loại & Bộ lọc | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="taxonomy">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Phân loại & Bộ lọc</h1>
            <p>Quản lý loại hoa, tông màu và dịp tặng dùng trong bộ lọc sản phẩm.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-tags"></i></div>
        </section>

        <section class="admin-grid-3 admin-section">
          <article class="admin-card">
            <h2 class="admin-card-title">Loại hoa</h2>
            <div class="admin-chip-list mt-3" id="taxonomyCategories"></div>
            <form class="admin-toolbar mt-3" data-taxonomy-form="categories"><input class="admin-input" style="max-width:190px" placeholder="Thêm loại hoa"><button class="admin-btn-light" type="submit">Thêm</button></form>
          </article>
          <article class="admin-card">
            <h2 class="admin-card-title">Tông màu</h2>
            <div class="admin-chip-list mt-3" id="taxonomyTones"></div>
            <form class="admin-toolbar mt-3" data-taxonomy-form="tones"><input class="admin-input" style="max-width:190px" placeholder="Thêm tông màu"><button class="admin-btn-light" type="submit">Thêm</button></form>
          </article>
          <article class="admin-card">
            <h2 class="admin-card-title">Dịp tặng</h2>
            <div class="admin-chip-list mt-3" id="taxonomyOccasions"></div>
            <form class="admin-toolbar mt-3" data-taxonomy-form="occasions"><input class="admin-input" style="max-width:190px" placeholder="Thêm dịp tặng"><button class="admin-btn-light" type="submit">Thêm</button></form>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
