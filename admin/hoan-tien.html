<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hoàn tiền | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="refunds">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Hoàn tiền</h1>
            <p>Quản lý yêu cầu huỷ đơn, hoàn cọc và hoàn tiền cho khách hàng.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-arrow-counterclockwise"></i></div>
        </section>

        <section class="admin-grid-2 admin-section">
                    <article class="admin-stat">
            <div class="admin-stat-icon"><i class="bi bi-hourglass-split"></i></div>
            <div class="admin-stat-label">Yêu cầu đang chờ</div>
            <div class="admin-stat-value"><span id="refundPendingCount">0</span></div>
            <div class="admin-stat-note">Cần xem xét và phản hồi</div>
          </article>
                    <article class="admin-stat">
            <div class="admin-stat-icon"><i class="bi bi-cash-coin"></i></div>
            <div class="admin-stat-label">Đã hoàn tiền</div>
            <div class="admin-stat-value"><span id="refundTotalAmount">0</span></div>
            <div class="admin-stat-note">Tổng tiền đã hoàn</div>
          </article>
        </section>

        <section class="admin-card admin-section">
          <h2 class="admin-card-title">Danh sách yêu cầu</h2>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>Mã yêu cầu</th><th>Mã đơn</th><th>Khách hàng</th><th>Số tiền</th><th>Lý do</th><th>Trạng thái</th></tr></thead>
              <tbody id="refundRows"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
