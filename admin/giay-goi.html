<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Màu giấy gói | CÁ'S HOA Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body data-admin-page="wrapping">
  <div class="admin-app">
    <aside class="admin-sidebar" id="adminSidebar"></aside>
    <button class="admin-overlay" id="adminOverlay" type="button" aria-label="Đóng menu"></button>

    <div class="admin-workspace">
      <header class="admin-topbar" id="adminTopbar"></header>

      <main class="admin-content">
        <section class="admin-hero">
          <div>
            <h1>Màu giấy gói</h1>
            <p>Quản lý các màu giấy được phép chọn khi cấu hình hoặc tư vấn mẫu hoa.</p>
          </div>
          <div class="admin-hero-icon"><i class="bi bi-palette"></i></div>
        </section>

        <section class="admin-grid-2 admin-section">
          <article class="admin-card">
            <h2 class="admin-card-title">Danh sách màu</h2>
            <div class="admin-table-wrap">
              <table class="admin-table" style="min-width:520px">
                <thead><tr><th>Màu</th><th>Tên</th><th>Mã màu</th><th>Trạng thái</th></tr></thead>
                <tbody id="wrappingRows"></tbody>
              </table>
            </div>
          </article>

          <article class="admin-card">
            <h2 class="admin-card-title">Thêm màu giấy</h2>
            <form id="wrappingForm" class="mt-3">
              <div class="mb-3"><label class="admin-label" for="wrapName">Tên màu</label><input class="admin-input" id="wrapName" required placeholder="Ví dụ: Nâu sữa"></div>
              <div class="mb-3"><label class="admin-label" for="wrapHex">Mã màu</label><input class="admin-input" id="wrapHex" type="color" value="#D8C9B8"></div>
              <button class="admin-btn" type="submit">Thêm màu</button>
            </form>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="../assets/js/products.js" defer></script>
  <script src="../assets/js/admin.js" defer></script>
</body>
</html>
